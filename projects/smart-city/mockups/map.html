<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #E2E8F0;
            height: 100vh;
            overflow: hidden
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace
        }

        .glass {
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, .06)
        }

        .glass-strong {
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, .1)
        }

        .map-container {
            position: relative;
            flex: 1;
            background: radial-gradient(ellipse at 40% 40%, rgba(6, 182, 212, .08), transparent 40%), radial-gradient(ellipse at 70% 60%, rgba(168, 85, 247, .05), transparent 30%), #080810;
            overflow: hidden
        }

        .grid-lines {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(6, 182, 212, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, .04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPan 30s linear infinite
        }

        @keyframes gridPan {
            to {
                background-position: 60px 60px
            }
        }

        .map-pin {
            position: absolute;
            cursor: pointer;
            transition: all .3s ease
        }

        .map-pin:hover {
            transform: scale(1.3)
        }

        .pin-pulse {
            animation: pinPulse 2s ease-in-out infinite
        }

        @keyframes pinPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(6, 182, 212, .4)
            }

            50% {
                box-shadow: 0 0 0 12px rgba(6, 182, 212, 0)
            }
        }

        .road-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, .15), transparent)
        }

        .road-vert {
            position: absolute;
            width: 1px;
            background: linear-gradient(transparent, rgba(6, 182, 212, .15), transparent)
        }
    </style>
</head>

<body>

    <div class="flex flex-col h-full">
        <!-- Top Bar -->
        <div class="p-5 pb-3 flex justify-between items-center z-20 bg-gradient-to-b from-[#050508] to-transparent">
            <div>
                <p class="text-[10px] text-cyan-400 font-bold uppercase tracking-[.3em] font-mono">LIVE FEED</p>
                <h1 class="text-xl font-bold text-white">Connected Map</h1>
            </div>
            <div class="flex gap-2">
                <button class="w-9 h-9 glass-strong rounded-xl flex items-center justify-center text-white/40"><i
                        data-lucide="layers" class="w-4 h-4"></i></button>
                <button class="w-9 h-9 glass-strong rounded-xl flex items-center justify-center text-white/40"><i
                        data-lucide="filter" class="w-4 h-4"></i></button>
            </div>
        </div>

        <!-- Map Area -->
        <div class="map-container">
            <div class="grid-lines"></div>

            <!-- Simulated Roads -->
            <div class="road-line" style="top:35%;left:10%;width:80%"></div>
            <div class="road-line" style="top:55%;left:5%;width:60%"></div>
            <div class="road-line" style="top:70%;left:20%;width:70%"></div>
            <div class="road-vert" style="left:30%;top:15%;height:70%"></div>
            <div class="road-vert" style="left:60%;top:25%;height:55%"></div>
            <div class="road-vert" style="left:75%;top:10%;height:60%"></div>

            <!-- Pins -->
            <div class="map-pin" style="top:30%;left:28%">
                <div
                    class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center pin-pulse">
                    <div class="w-3 h-3 rounded-full bg-cyan-400"></div>
                </div>
                <div class="glass-strong rounded-lg px-2 py-1 mt-1 whitespace-nowrap">
                    <span class="text-[8px] font-mono text-cyan-400 font-bold">Transit Hub A</span>
                </div>
            </div>

            <div class="map-pin" style="top:50%;left:58%">
                <div
                    class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center">
                    <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
                </div>
                <div class="glass-strong rounded-lg px-2 py-1 mt-1 whitespace-nowrap">
                    <span class="text-[8px] font-mono text-emerald-400 font-bold">EV Station</span>
                </div>
            </div>

            <div class="map-pin" style="top:38%;left:72%">
                <div class="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-400/40 flex items-center justify-center pin-pulse"
                    style="animation-delay:.5s">
                    <div class="w-3 h-3 rounded-full bg-amber-400"></div>
                </div>
                <div class="glass-strong rounded-lg px-2 py-1 mt-1 whitespace-nowrap">
                    <span class="text-[8px] font-mono text-amber-400 font-bold">⚠ Road Work</span>
                </div>
            </div>

            <div class="map-pin" style="top:65%;left:35%">
                <div
                    class="w-8 h-8 rounded-full bg-violet-500/20 border border-violet-400/40 flex items-center justify-center">
                    <div class="w-3 h-3 rounded-full bg-violet-400"></div>
                </div>
                <div class="glass-strong rounded-lg px-2 py-1 mt-1 whitespace-nowrap">
                    <span class="text-[8px] font-mono text-violet-400 font-bold">Sensor Node</span>
                </div>
            </div>

            <!-- Current Location -->
            <div class="map-pin" style="top:48%;left:44%">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 border-2 border-blue-400/60 flex items-center justify-center pin-pulse"
                    style="animation-delay:.8s">
                    <div class="w-4 h-4 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Info Panel -->
        <div class="p-4 z-20">
            <div class="glass-strong rounded-[24px] p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-white text-sm">Nearby Infrastructure</h3>
                    <span class="text-[9px] text-cyan-400 font-mono font-bold">4 nodes active</span>
                </div>
                <div class="flex gap-3 overflow-x-auto pb-1" style="-ms-overflow-style:none;scrollbar-width:none">
                    <div class="glass rounded-2xl p-3 shrink-0 flex items-center gap-2.5 min-w-[140px]">
                        <div
                            class="w-8 h-8 rounded-xl bg-cyan-500/10 flex items-center justify-center border border-cyan-500/20 shrink-0">
                            <i data-lucide="train-front" class="w-4 h-4 text-cyan-400"></i></div>
                        <div>
                            <p class="text-[10px] font-bold text-white">Metro Stn</p>
                            <p class="text-[8px] text-white/20 font-mono">300m • 2 min</p>
                        </div>
                    </div>
                    <div class="glass rounded-2xl p-3 shrink-0 flex items-center gap-2.5 min-w-[140px]">
                        <div
                            class="w-8 h-8 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 shrink-0">
                            <i data-lucide="battery-charging" class="w-4 h-4 text-emerald-400"></i></div>
                        <div>
                            <p class="text-[10px] font-bold text-white">EV Charge</p>
                            <p class="text-[8px] text-white/20 font-mono">850m • 3 avail</p>
                        </div>
                    </div>
                    <div class="glass rounded-2xl p-3 shrink-0 flex items-center gap-2.5 min-w-[140px]">
                        <div
                            class="w-8 h-8 rounded-xl bg-violet-500/10 flex items-center justify-center border border-violet-500/20 shrink-0">
                            <i data-lucide="wifi" class="w-4 h-4 text-violet-400"></i></div>
                        <div>
                            <p class="text-[10px] font-bold text-white">WiFi Zone</p>
                            <p class="text-[8px] text-white/20 font-mono">150m • 120Mbps</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="px-4 pb-4 z-20">
            <div class="glass-strong rounded-[22px] px-6 py-3 flex justify-between items-center max-w-sm mx-auto">
                <button class="flex flex-col items-center gap-1 text-white/20"><i data-lucide="layout-dashboard"
                        class="w-5 h-5"></i><span class="text-[8px] font-bold font-mono">Dashboard</span></button>
                <button class="flex flex-col items-center gap-1 text-cyan-400"><i data-lucide="map"
                        class="w-5 h-5"></i><span class="text-[8px] font-bold font-mono">Map</span></button>
                <button class="flex flex-col items-center gap-1 text-white/20"><i data-lucide="alert-circle"
                        class="w-5 h-5"></i><span class="text-[8px] font-bold font-mono">Report</span></button>
                <button class="flex flex-col items-center gap-1 text-white/20"><i data-lucide="settings"
                        class="w-5 h-5"></i><span class="text-[8px] font-bold font-mono">Settings</span></button>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
